name: Build Tray win-x64

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build win-x64 packages
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore Dependencies
        run: dotnet restore

      - name: Localize API settings to Chinese
        shell: pwsh
        run: ./tools/Localize-SettingWindow.ps1

      - name: Publish self-contained withruntime EXE
        shell: pwsh
        run: |
          dotnet publish ./LiveCaptionsTranslator.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o ./publish-withruntime
          Remove-Item ./publish-withruntime/*.pdb -ErrorAction SilentlyContinue
          Rename-Item ./publish-withruntime/LiveCaptionsTranslator.exe LiveCaptionsTranslator-Tray-ZH-win-x64-withruntime.exe

      - name: Publish compact framework-dependent EXE
        shell: pwsh
        run: |
          dotnet publish ./LiveCaptionsTranslator.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o ./publish-compact
          Remove-Item ./publish-compact/*.pdb -ErrorAction SilentlyContinue
          Rename-Item ./publish-compact/LiveCaptionsTranslator.exe LiveCaptionsTranslator-Tray-ZH-win-x64.exe

      - name: Verify package sizes
        shell: pwsh
        run: |
          $withRuntime = Get-Item ./publish-withruntime/LiveCaptionsTranslator-Tray-ZH-win-x64-withruntime.exe
          $compact = Get-Item ./publish-compact/LiveCaptionsTranslator-Tray-ZH-win-x64.exe
          Write-Host "withruntime EXE size: $($withRuntime.Length) bytes"
          Write-Host "compact EXE size: $($compact.Length) bytes"
          if ($withRuntime.Length -lt 30000000) { throw "Self-contained EXE is unexpectedly small." }
          if ($compact.Length -gt 30000000) { throw "Framework-dependent EXE is unexpectedly large." }

      - name: Create ZIP packages
        shell: pwsh
        run: |
          Compress-Archive -Path ./publish-withruntime/LiveCaptionsTranslator-Tray-ZH-win-x64-withruntime.exe -DestinationPath ./LiveCaptionsTranslator-Tray-ZH-win-x64-withruntime.zip -Force
          Compress-Archive -Path ./publish-compact/LiveCaptionsTranslator-Tray-ZH-win-x64.exe -DestinationPath ./LiveCaptionsTranslator-Tray-ZH-win-x64.zip -Force

      - name: Upload Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LiveCaptionsTranslator-Tray-ZH-win-x64-packages
          path: |
            ./publish-withruntime/LiveCaptionsTranslator-Tray-ZH-win-x64-withruntime.exe
            ./publish-compact/LiveCaptionsTranslator-Tray-ZH-win-x64.exe
          if-no-files-found: error

      - name: Publish stable GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "tray-zh-latest"
          $repo = "${{ github.repository }}"
          $withRuntimeExe = "./publish-withruntime/LiveCaptionsTranslator-Tray-ZH-win-x64-withruntime.exe"
          $compactExe = "./publish-compact/LiveCaptionsTranslator-Tray-ZH-win-x64.exe"
          $withRuntimeZip = "./LiveCaptionsTranslator-Tray-ZH-win-x64-withruntime.zip"
          $compactZip = "./LiveCaptionsTranslator-Tray-ZH-win-x64.zip"

          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $withRuntimeExe $compactExe $withRuntimeZip $compactZip --clobber --repo $repo
          } else {
            gh release create $tag $withRuntimeExe $compactExe $withRuntimeZip $compactZip --repo $repo --target "${{ github.sha }}" --title "LiveCaptions Translator 托盘中文版（最新版）" --notes "提供两种 win-x64 单文件版本：withruntime 可直接运行；普通版体积更小，但电脑需安装 .NET 8 Desktop Runtime x64。界面中文在构建期写入 XAML，不再做运行时遍历汉化；保留原翻译逻辑。" --latest=false
          }
