name: Build Tray win-x64 withruntime

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build win-x64 withruntime
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore Dependencies
        run: dotnet restore

      - name: Publish self-contained single EXE
        shell: pwsh
        run: |
          dotnet publish ./LiveCaptionsTranslator.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o ./publish
          Remove-Item ./publish/*.pdb -ErrorAction SilentlyContinue
          Rename-Item ./publish/LiveCaptionsTranslator.exe LiveCaptionsTranslator-Tray-ZH-win-x64-withruntime.exe

      - name: Verify EXE size
        shell: pwsh
        run: |
          $file = Get-Item ./publish/LiveCaptionsTranslator-Tray-ZH-win-x64-withruntime.exe
          Write-Host "Built EXE size: $($file.Length) bytes"
          if ($file.Length -lt 30000000) { throw "Self-contained EXE is unexpectedly small." }

      - name: Upload withruntime EXE
        uses: actions/upload-artifact@v4
        with:
          name: LiveCaptionsTranslator-Tray-ZH-win-x64-withruntime
          path: ./publish/LiveCaptionsTranslator-Tray-ZH-win-x64-withruntime.exe
          if-no-files-found: error
